# RZDO fork: builds the ingest-only image with published HistorySync and on-demand history fetch.
name: rzdo-image
on:
  push:
    branches: [rzdo-history]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ghcr.io/deorozindo/waxum:rzdo-history,ghcr.io/deorozindo/waxum:rzdo-history-${{ github.sha }}
